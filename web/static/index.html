<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star · 本地大模型</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">◈</span>
        <div>
          <h1>Star</h1>
          <p id="status">正在检查模型状态…</p>
        </div>
      </div>
      <div class="actions">
        <div class="mode-tabs" id="modeTabs">
          <button id="tabChat" class="mode-tab active">对话</button>
          <button id="tabPaint" class="mode-tab">绘画</button>
        </div>
        <button id="clearBtn" class="btn ghost" title="清空对话">清空对话</button>
      </div>
    </header>

    <main id="chat" class="chat">
      <div class="welcome" id="welcome">
        <h2>模型已在本地运行</h2>
        <p>这是一个从零手写 Transformer 的推理引擎，对话不会离开你的电脑。</p>
      </div>
      <div class="welcome model-panel" id="modelPanel" hidden>
        <h2>欢迎使用 Star</h2>
        <p id="modelPanelText">首次使用需要下载一个开源大模型（约 0.6GB），下载完成后即可离线对话。</p>
        <div class="model-actions">
          <button id="downloadBtn" class="btn primary big">下载模型并开始</button>
          <p class="hint" id="gpuHint" hidden></p>
        </div>
        <div class="progress" id="progressWrap" hidden>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <p class="hint" id="progressText">准备中…</p>
        </div>
      </div>

      <!-- 本地绘画面板 -->
      <div class="welcome paint-panel" id="paintPanel" hidden>
        <h2>本地绘画</h2>
        <p class="desc">用文字描述画面，模型在本地生成图片，不会上传任何内容。</p>
        <textarea id="paintInput" rows="2" placeholder="描述你想画的画面，例如：黄昏的海边，一只橘猫坐在岩石上看日落"></textarea>
        <div class="paint-options">
          <label>尺寸
            <select id="paintSize">
              <option value="512x512">方形 512×512</option>
              <option value="512x768">竖版 512×768</option>
              <option value="768x512">横版 768×512</option>
            </select>
          </label>
          <label>质量
            <select id="paintSteps">
              <option value="4">标准（快）</option>
              <option value="8">精细</option>
              <option value="12">高精细</option>
            </select>
          </label>
        </div>
        <div class="model-actions">
          <button id="paintBtn" class="btn primary big">生成图片</button>
          <p class="hint" id="paintHint" hidden></p>
        </div>
        <div class="progress" id="paintProgressWrap" hidden>
          <div class="progress-bar"><div class="progress-fill" id="paintProgressFill"></div></div>
          <p class="hint" id="paintProgressText">准备中…</p>
        </div>
        <div class="paint-result" id="paintResult" hidden>
          <img id="paintImg" alt="生成的图片" />
          <div class="paint-meta" id="paintMeta"></div>
          <div class="paint-actions">
            <button id="paintSaveBtn" class="btn primary">下载图片</button>
            <button id="paintAgainBtn" class="btn ghost">再画一张</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="composer">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="sendBtn" class="btn primary">发送</button>
        <button id="stopBtn" class="btn danger" hidden>停止</button>
      </div>
      <p class="hint">温度、top-p 等参数可在 app.js 顶部调整 · 本地推理速度取决于硬件</p>
    </footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
